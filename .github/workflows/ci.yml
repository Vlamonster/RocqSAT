name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      - name: Install dependencies
        run: |
          opam repo add rocq-released https://coq.inria.fr/opam/released
          opam repo add rocq-extra-dev https://coq.inria.fr/opam/extra-dev
          opam install . --deps-only

      - name: Build project
        run: opam exec -- dune build

      - name: Generate documentation
        if: github.ref == 'refs/heads/thesis'
        run: |
          mkdir doc
          opam exec -- rocq doc -Q _build/default/abstraction/ RocqSAT -Q _build/default/refinement/core/ RocqSAT.refinement -Q _build/default/refinement/c/ RocqSAT.refinement.c _build/default/abstraction/*.v _build/default/abstraction/rules/*.v _build/default/abstraction/utils/*.v _build/default/abstraction/systems/*.v _build/default/refinement/core/*.v _build/default/refinement/c/*.v -d doc -toc

      - name: Upload documentation artifact
        if: github.ref == 'refs/heads/thesis'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./doc

  deploy:
    if: github.ref == 'refs/heads/thesis'

    runs-on: ubuntu-latest

    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
